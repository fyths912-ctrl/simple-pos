name: Build and deploy Frontend to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/main_app-tech0-gen12-24-fe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build Frontend
        working-directory: frontend
        env:
          API_PROXY_TARGET: https://app-tech0-gen12-24-be.azurewebsites.net
        run: |
          npm ci
          npm run build

      - name: Prepare deployment package
        working-directory: frontend
        run: |
          mkdir -p deploy-package/.next
          cp -a .next/standalone/. deploy-package/
          cp -a .next/static deploy-package/.next/static
          if [ -d public ]; then
            cp -a public deploy-package/public
          fi

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: frontend/deploy-package/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-tech0-gen12-24-fe'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8C98B8FFF28745078BB0856CFE87FC89 }}
