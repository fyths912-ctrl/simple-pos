name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_USER: pos
          MYSQL_PASSWORD: ci-pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:ci-root@127.0.0.1:3306/pos_app_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: 依存ライブラリの脆弱性スキャン（T-064）
        run: pip-audit -r requirements.txt
      - name: pytest（実 MySQL 8.0）
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: 依存ライブラリの脆弱性スキャン（T-064）
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
